services:
  pollify-postgres:
    image: postgres:18.1-bookworm
    container_name: pollify-env-postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - ${PROJECT_ROOT}/out/pgdata:/var/lib/postgresql
    restart: always

  pollify-postgres-migrate:
    image: migrate/migrate:v4.19.1
    volumes:
      - ./migrations:/migrations

  port-forwarder:
    image: alpine/socat:1.8.0.3
    container_name: pollify-postgres-port-forwarder
    command: tcp-listen:5432,fork,reuseaddr tcp-connect:pollify-postgres:5432
    ports:
      - "127.0.0.1:5432:5432"

  rabbitmq:
    image: rabbitmq:4.3.5-management-alpine
    hostname: pollify-rabbit
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBIT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBIT_PASSWORD}

  redis:
    image: redis:alpine3.23
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  swagger:
    build:
      context: ${PROJECT_ROOT}
      dockerfile_inline: |
        FROM golang:1.25.6-alpine
        RUN apk add --no-cache git
        RUN go install github.com/swaggo/swag/cmd/swag@v1.16.6
        WORKDIR /code
        ENTRYPOINT ["swag"]
    volumes:
      - ${PROJECT_ROOT}:/code
